<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>腕上必背 · 试玩</title>
<style>
  :root {
    --bg: #000;
    --surface: #1a1a1c;
    --item: #26262a;
    --item-2: #33333a;
    --line: #34343a;
    --text: #fff;
    --dim: #c8c8d0;
    --muted: #9a9aa4;
    --accent: #0a84ff;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: #fbfbf9;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body { display: flex; align-items: center; justify-content: center; }

  .watch {
    width: 466px;
    height: 466px;
    border-radius: 50%;
    background: var(--bg);
    overflow: hidden;
    position: relative;
    color: var(--text);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .hidden { display: none !important; }

  .backbtn {
    position: absolute;
    top: 56px;
    left: 76px;
    width: 46px;
    height: 46px;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, .1);
    color: #fff;
    font: 26px/1 -apple-system, sans-serif;
    cursor: pointer;
    z-index: 2;
  }
  .backbtn:active { background: rgba(255, 255, 255, .2); }

  /* ---------- 通用结构 ---------- */
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; }

  .scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  .scroll::-webkit-scrollbar { width: 0; }

  .body { padding: 0 34px 44px; }

  .hdr {
    padding: 56px 30px 8px;
    text-align: center;
    flex: none;
  }

  .title { font-size: 36px; font-weight: 600; line-height: 1.2; }
  .sub { margin-top: 4px; font-size: 22px; color: var(--dim); }
  .sub.accent { color: #ffd60a; }

  .row {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 104px;
    margin-bottom: 12px;
    padding: 12px 28px;
    border-radius: 30px;
    background: var(--item);
    cursor: pointer;
  }
  .row:active { background: var(--item-2); }

  .row b { font-size: 40px; font-weight: 500; line-height: 1.2; }
  .row span { margin-top: 2px; font-size: 22px; color: var(--dim); }

  .row.cont { background: #12324f; }
  .row.cont b { color: #8cc4ff; }

  .row.quiz b { color: #c9a7ff; }

  .scard {
    margin: 4px 8px 14px;
    padding: 20px 16px 18px;
    border-radius: 34px;
    text-align: center;
    cursor: pointer;
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .c-top { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .c-top img { width: 30px; height: 30px; }
  .c-top span { font-size: 22px; color: #eaf2ff; }
  .c-mid { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .c-num { font-size: 76px; font-weight: 700; line-height: 1.05; }
  .c-mid i { font-style: normal; font-size: 28px; }
  .c-quote { font-size: 30px; font-weight: 600; line-height: 1.25; }
  .c-quote2 { font-size: 30px; font-weight: 600; margin-top: 2px; }
  .c-bar {
    width: 260px; height: 12px; margin: 12px auto 0; border-radius: 6px;
    background: rgba(0,0,0,.26); overflow: hidden;
  }
  .c-fill { height: 12px; border-radius: 6px; background: #fff; }
  .c-goal { font-size: 21px; margin-top: 10px; }
  .c-tip { font-size: 20px; margin-top: 6px; color: rgba(255,255,255,.85); }
  .scard-lv1 { background: linear-gradient(to bottom, #60a5fa, #1d4ed8); }
  .scard-lv2 { background: linear-gradient(to bottom, #4ade80, #15803d); }
  .scard-lv3 { background: linear-gradient(to bottom, #fb923c, #c2410c); }
  .scard-lv4 { background: linear-gradient(to bottom, #a855f7, #6d28d9); }
  .scard-lv5 { background: linear-gradient(to bottom, #fbbf24, #b45309); }
  .scard.scard-reached { border: 3px solid #fde68a; }
  .scard.scard-reached .c-fill { background: #fde68a; }

  .bdg {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; margin-bottom: 8px; border-radius: 24px; background: var(--item);
  }
  .bdg b { font-size: 28px; font-weight: 500; color: var(--muted); }
  .bdg em { font-size: 20px; font-style: normal; color: var(--muted); }
  .bdg.b-bronze { background: #3a2a1c; }
  .bdg.b-gold { background: #3a3410; }
  .bdg.b-diamond { background: #14333f; }
  .medal {
    width: 110px; height: 110px; border-radius: 55px; margin: 18px auto 12px;
    display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 600;
  }

  .wb {
    padding: 14px 22px;
    margin-bottom: 10px;
    border-radius: 26px;
    background: var(--item);
  }
  .wb b { display: block; font-size: 26px; font-weight: 500; line-height: 1.35; }
  .wb em { display: block; font-size: 20px; font-style: normal; color: var(--muted); margin-top: 4px; }
  .wb.ok { background: #14251a; }
  .wb.ok em { color: #7ce38b; }

  .cat {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 104px;
    margin-bottom: 10px;
    padding: 10px 28px;
    border-radius: 30px;
    background: var(--item);
    cursor: pointer;
  }
  .cat:active { background: var(--item-2); }
  .cat b { font-size: 40px; font-weight: 500; }
  .cat em { font-size: 24px; font-style: normal; color: #ffd60a; }

  .pt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 100px;
    margin-bottom: 10px;
    padding: 10px 28px;
    border-radius: 30px;
    background: var(--item);
    cursor: pointer;
  }
  .pt:active { background: var(--item-2); }
  .pt b { font-size: 40px; font-weight: 500; }
  .pt.read b { color: var(--dim); }
  .pt em { font-size: 22px; font-style: normal; color: var(--muted); }

  /* ---------- 阅读页 ---------- */
  .reader .hdr { padding-top: 52px; }
  .scrollwrap { position: relative; flex: 1; min-height: 0; }
  .scrollwrap .scroll { position: absolute; inset: 0; }
  .scrollwrap .fade {
    position: absolute; left: 0; right: 0; bottom: 0; height: 64px;
    background: linear-gradient(to bottom, rgba(0,0,0,0), #000);
    pointer-events: none;
  }
  .reader-title { font-weight: 600; line-height: 1.15; }

  .lines { padding: 0 24px 30px; text-align: center; }
  .ln { color: var(--text); line-height: 1.32; padding: 3px 0; word-break: break-word; }
  .tr { color: #8cc4ff; line-height: 1.35; padding: 1px 20px 9px; }
  .note { margin-top: 16px; font-size: 30px; color: var(--dim); }
  .extra { margin-top: 8px; font-size: 26px; color: var(--dim); }
  .sec { margin-top: 18px; padding-top: 8px; font-size: 22px; font-weight: 500; color: #ffd60a; }
  .pic { display: flex; justify-content: center; padding: 6px 0 2px; }
  .pic img { width: 170px; height: 170px; object-fit: contain; }
  .ex { color: var(--dim); line-height: 1.4; padding: 1px 0; }
  .wd { color: #9be29b; line-height: 1.4; padding: 1px 0; }
  .sn { color: #8cc4ff; line-height: 1.4; padding: 1px 0; }

  .foot {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 6px 12px 68px;
  }

  .btn {
    height: 74px;
    padding: 0 16px;
    white-space: nowrap;
    border: 0;
    border-radius: 37px;
    background: var(--item);
    color: var(--text);
    font-size: 26px;
    font-family: inherit;
    cursor: pointer;
  }
  .btn:active { background: var(--item-2); }
  .btn.primary { background: var(--accent); font-size: 30px; }
  .btn.small { width: 56px; padding: 0; font-size: 30px; }
  .btn.on { background: #1d4b7a; color: #8cc4ff; }
  .btn.off { background: #16161a; color: var(--muted); }

  /* ---------- 设置 ---------- */
  .card {
    margin: 0 4px 16px;
    padding: 20px 26px 22px;
    border-radius: 30px;
    background: #131317;
    border: 1px solid #24242c;
  }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; }
  .card-head b { font-size: 34px; font-weight: 500; }
  .card-head span { font-size: 28px; color: #c4b5fd; }

  .track {
    position: relative;
    height: 56px;
    margin-top: 16px;
    border-radius: 28px;
    background: linear-gradient(to right, #2a1050, #5b21b6, #7c3aed, #c084fc);
  }
  .knob {
    position: absolute;
    top: 0;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #f5e7d3;
    border: 2px solid #fffaf0;
    box-sizing: border-box;
    pointer-events: none;
  }

  input[type="range"] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 56px;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }

  .preview {
    margin: 0 4px;
    padding: 24px;
    border-radius: 30px;
    background: #0b0b0e;
    border: 1px solid #1c1c22;
    text-align: center;
    color: var(--text);
  }

  .tip {
    padding: 8px 0 0;
    font-size: 20px;
    color: var(--muted);
    text-align: center;
    min-height: 26px;
  }
</style>
</head>
<body>

<div class="watch" id="watch">
  <div class="view" id="view"></div>
</div>

<script src="data.js"></script>
<script>
(function () {
  var D = window.WRIST;
  var view = document.getElementById('view');

  // ---------- 存储 ----------
  function load(key, fallback) {
    try {
      var raw = localStorage.getItem('wrist-' + key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem('wrist-' + key, JSON.stringify(value)); } catch (e) {}
  }

  // ---------- 内容索引 ----------
  var flatCache = {};
  function subject(file) { return D.data[file]; }

  function flat(file) {
    if (flatCache[file]) return flatCache[file];
    var s = subject(file);
    if (!s) return [];
    var out = [];
    s.chapters.forEach(function (chapter) {
      chapter.points.forEach(function (point) {
        out.push({ chapter: chapter.name, point: point });
      });
    });
    flatCache[file] = out;
    return out;
  }

  function findPoint(id) {
    for (var i = 0; i < D.subjects.length; i += 1) {
      var file = D.subjects[i].file;
      var list = flat(file);
      for (var j = 0; j < list.length; j += 1) {
        if (pointIdOf(file, j) === id) {
          return { file: file, name: D.subjects[i].name, index: j, entry: list[j] };
        }
      }
    }
    return null;
  }

  function pointIdOf(file, index) { return file + '#' + index; }

  function countOf(file) { return flat(file).length; }

  // ---------- 字号 ----------
  var STEPS = [44, 40, 36, 32, 30, 28, 26, 24, 22];
  var AVAIL = 330;
  var RATIO = [0.8, 0.9, 1, 1.1, 1.2];

  function em(line) {
    var w = 0;
    for (var i = 0; i < line.length; i += 1) {
      w += line.codePointAt(i) >= 0x2e80 ? 1 : 0.55;
    }
    return w;
  }

  /** 附属行（题目/好词/好句）字号：逐行算，保证不溢出圆屏 */
  function subFont(line, cap) {
    var e = em(line || '');
    var steps = [26, 24, 22, 20, 18];
    for (var i = 0; i < steps.length; i += 1) {
      if (steps[i] <= cap && e * steps[i] <= AVAIL) return steps[i];
    }
    return 18;
  }

  function fontFor(lines, level) {
    var maxEm = 0;
    (lines || []).forEach(function (l) { maxEm = Math.max(maxEm, em(l)); });
    if (!maxEm) return 40;
    var size = STEPS[STEPS.length - 1];
    for (var i = 0; i < STEPS.length; i += 1) {
      if (maxEm * STEPS[i] <= AVAIL) { size = STEPS[i]; break; }
    }
    var r = RATIO[level] === undefined ? 1 : RATIO[level];
    return Math.max(18, Math.min(56, Math.round(size * r)));
  }

  // ---------- 状态 ----------
  var state = {
    view: 'home',
    file: null,
    chapter: -1,
    pointId: null,
    scrollTop: 0,
    quiz: null,
    cardFlip: false,
    justChecked: false,
    badgeId: '',
    revealDismissed: false
  };

  // ---------- 错题本（和手表端同一个数据模型，存 localStorage）----------
  function wrongAll() {
    var v = load('wrongbook', null);
    return v && v.items ? v : { items: [] };
  }
  function wrongSave(v) { save('wrongbook', v); }
  function wrongAdd(q) {
    var all = wrongAll();
    var found = null;
    all.items.forEach(function (it) { if (it.key === q.key) found = it; });
    if (found) {
      found.wrongCount = (found.wrongCount || 0) + 1;
      found.streak = 0;
      found.lastAt = Date.now();
    } else {
      all.items.push({
        key: q.key, pointId: q.pointId, subjectId: q.subjectId, subjectName: q.subjectName,
        chapterName: q.chapterName, ask: q.ask, answer: q.answer,
        wrongCount: 1, reviewCount: 0, streak: 0, addedAt: Date.now(), lastAt: Date.now()
      });
    }
    wrongSave(all);
  }
  function wrongReview(key, correct) {
    var all = wrongAll();
    all.items.forEach(function (it) {
      if (it.key !== key) return;
      it.reviewCount = (it.reviewCount || 0) + 1;
      it.lastAt = Date.now();
      if (correct) it.streak = (it.streak || 0) + 1;
      else { it.streak = 0; it.wrongCount = (it.wrongCount || 0) + 1; }
    });
    wrongSave(all);
  }
  function wrongRemove(key) {
    var all = wrongAll();
    all.items = all.items.filter(function (it) { return it.key !== key; });
    wrongSave(all);
  }
  function isMastered(it) { return (it.streak || 0) >= 3; }
  function wrongToReview() { return wrongAll().items.filter(function (it) { return !isMastered(it); }); }

  // ---------- 出题：按内容类型分题型 ----------
  function looksLikeSentence(lines) {
    if (lines.length < 2) return false;
    var hit = 0;
    lines.forEach(function (line) {
      if (/[，。；！？,.;!?]$/.test(line) && line.length >= 4 && line.length <= 26) hit += 1;
    });
    return hit >= Math.ceil(lines.length * 0.7);
  }
  function looksLikeTime(line) { return /年|世纪/.test(line || '') && /\d/.test(line || ''); }

  function questionsOfPoint(point, file, subjectName, chapterName) {
    var lines = (point.f || []).filter(function (l) { return !!l; });
    if (lines.length < 2) return [];
    var meta = { pointId: file + '#' + point.t, subjectId: file, subjectName: subjectName, chapterName: chapterName };
    var out = [];

    if (looksLikeTime(lines[0])) {
      out.push({ key: point.t + '#time|' + file, type: 'time', title: point.t, hint: '这件事发生在什么时候',
        ask: lines.slice(1).join('；'), answer: lines[0], meta: meta });
      out.push({ key: point.t + '#event|' + file, type: 'event', title: point.t, hint: '这个时间发生了什么',
        ask: lines[0], answer: lines.slice(1).join('；'), meta: meta });
      return out;
    }

    if (looksLikeSentence(lines)) {
      var limit = Math.min(3, lines.length - 1);
      for (var i = 1; i <= limit; i += 1) {
        var reverse = i % 2 === 0;
        out.push({
          key: point.t + '#' + i + '|' + file, type: 'next', title: point.t,
          hint: reverse ? '默出上一句' : '默出下一句',
          ask: reverse ? lines[i] : lines[i - 1],
          answer: reverse ? lines[i - 1] : lines[i],
          reverse: reverse, meta: meta
        });
      }
      return out;
    }

    out.push({
      key: point.t + '#recall|' + file, type: 'recall', title: point.t,
      hint: '在心里过一遍这 ' + Math.min(4, lines.length) + ' 条要点', ask: '', answer: lines.slice(0, 4).join('；'), meta: meta
    });
    return out;
  }

  function poolOfFile(file) {
    var s = subject(file);
    var pool = [];
    s.chapters.forEach(function (ch) {
      ch.points.forEach(function (p) {
        pool = pool.concat(questionsOfPoint(p, file, s.name, ch.name));
      });
    });
    return pool;
  }
  function poolOfAll() {
    var pool = [];
    D.subjects.forEach(function (s) { pool = pool.concat(poolOfFile(s.file)); });
    return pool;
  }
  function shuffle(a) {
    var arr = a.slice();
    for (var i = arr.length - 1; i > 0; i -= 1) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function level() { return load('level', 2); }
  function brightness() { return load('bright', 178); }
  function showTrans() { return load('trans', false); }
  function showColor() { return load('color', true); }

  // ---------- 打卡（与手表端同一套规则）----------
  function dk(d) {
    var x = d || new Date();
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return x.getFullYear() + '-' + p(x.getMonth() + 1) + '-' + p(x.getDate());
  }
  function yk() { var d = new Date(); d.setDate(d.getDate() - 1); return dk(d); }
  function streakState() {
    var v = load('streak', null);
    if (!v || typeof v !== 'object') return { streak: 0, lastDate: '', todayDate: '', todayCount: 0, checkedDate: '', milestones: [], pending: 0 };
    return {
      streak: v.streak || 0, lastDate: v.lastDate || '', todayDate: v.todayDate || '',
      todayCount: v.todayCount || 0, checkedDate: v.checkedDate || '', milestones: v.milestones || [], pending: v.pending || 0
    };
  }
  function getStreak() {
    var s = streakState();
    if (s.lastDate === dk() || s.lastDate === yk()) return s.streak;
    return 0;
  }
  function getTodayCount() { var s = streakState(); return s.todayDate === dk() ? s.todayCount : 0; }
  function getGoal() { return load('goal', 10); }
  function touchToday() {
    var s = streakState();
    var today = dk();
    if (s.todayDate !== today) { s.todayDate = today; s.todayCount = 0; }
    s.todayCount += 1;
    if (s.lastDate !== today) {
      s.streak = s.lastDate === yk() ? (s.streak || 0) + 1 : 1;
      s.lastDate = today;
      var ms = [3, 7, 15, 30, 60, 100];
      if (ms.indexOf(s.streak) >= 0 && (s.milestones || []).indexOf(s.streak) < 0) {
        s.milestones = (s.milestones || []).concat([s.streak]);
        s.pending = s.streak;
      }
    }
    s.checkedDate = today;
    save('streak', s);
  }
  function isChecked() { return streakState().checkedDate === dk(); }
  function checkIn() {
    var s = streakState();
    var today = dk();
    if (s.lastDate !== today) {
      s.streak = s.lastDate === yk() ? (s.streak || 0) + 1 : 1;
      s.lastDate = today;
      var ms = [3, 7, 15, 30, 60, 100];
      if (ms.indexOf(s.streak) >= 0 && (s.milestones || []).indexOf(s.streak) < 0) {
        s.milestones = (s.milestones || []).concat([s.streak]);
        s.pending = s.streak;
      }
    }
    s.checkedDate = today;
    save('streak', s);
  }
  function milestoneText(days) {
    if (days >= 100) return '100 天！这已经是习惯了';
    if (days >= 30) return '满 30 天，了不起！';
    if (days >= 15) return '15 天，稳住了';
    if (days >= 7) return '连续 7 天，保持住！';
    if (days >= 3) return '第 3 天，习惯正在形成';
    return '又坚持了一天';
  }
  function dailyQuote() {
    var list = (D.quotes || []);
    if (!list.length) return { q: '', from: '', cheer: '' };
    var d = new Date();
    var seed = d.getFullYear() * 372 + d.getMonth() * 31 + d.getDate();
    return list[seed % list.length];
  }
  function cardClass(streak) {
    if (streak >= 30) return 'scard scard-lv5';
    if (streak >= 14) return 'scard scard-lv4';
    if (streak >= 7) return 'scard scard-lv3';
    if (streak >= 3) return 'scard scard-lv2';
    return 'scard scard-lv1';
  }
  function streakCardHtml() {
    var streak = getStreak();
    var today = getTodayCount();
    var goal = getGoal();
    var quote = dailyQuote();
    var checked = isChecked();
    var cls = cardClass(streak) + (checked ? ' scard-reached' : '');
    var BAR = 260;

    if (!state.cardFlip) {
      var ratio = goal > 0 ? Math.min(1, today / goal) : 0;
      var left = goal - today;
      var tip = checked ? '再点一下看金句' : (left > 0 ? '还差 ' + left + ' 条到今日目标' : '再点一下看金句');
      if (state.justChecked) tip = '打卡成功，明天继续';
      return '<div class="' + cls + '" data-act="flip">' +
        '<div class="c-top"><img src="ui/' + (checked ? 'check' : 'flame') + '.png"><span>' +
        (checked ? '今天已打卡' : '点一下打卡') + '</span></div>' +
        '<div class="c-mid"><b class="c-num">' + streak + ' 天</b></div>' +
        '<div class="c-bar"><div class="c-fill" style="width:' + Math.round(BAR * ratio) + 'px"></div></div>' +
        '<div class="c-goal">今日 ' + today + ' / ' + goal + '</div>' +
        '<div class="c-tip">' + tip + '</div>' +
        '</div>';
    }

    var parts = (quote.q || '').split('，');

  function card(name, value, key, current, max) {

      '<div class="card-head"><b>' + name + '</b><span>' + value + '</span></div>' +

      '</div></div>';
  }

  // ---------- 徽章（青铜/黄金/钻石） ----------
  function badgeNames() { var m = {}; (D.badgeNames || []).forEach(function (b) { m[b.id] = b.name; }); return m; }
  function tierOf(read, total) {
    if (!total) return '';
    if (read >= total) return 'diamond';
    if (read / total >= 0.7) return 'gold';
    if (read / total >= 0.3 && read > 0) return 'bronze';
    return '';
  }
  function tierLabel(t) { return t === 'diamond' ? '钻石' : t === 'gold' ? '黄金' : t === 'bronze' ? '青铜' : '未解锁'; }
  function tierColor(t) { return t === 'diamond' ? '#7ce3ff' : t === 'gold' ? '#ffd60a' : t === 'bronze' ? '#e0a880' : '#7c7c8a'; }
  function tierCls(t) { return t === 'diamond' ? ' b-diamond' : t === 'gold' ? ' b-gold' : t === 'bronze' ? ' b-bronze' : ''; }

  function badgeList() {
    var readMap = readIds();
    var names = badgeNames();
    var out = [];
    D.subjects.forEach(function (s) {
      var subj = subject(s.file);
      var base = 0;
      subj.chapters.forEach(function (ch) {
        var read = 0;
        ch.points.forEach(function (p, pi) { if (readMap[pointIdOf(s.file, base + pi)]) read += 1; });
        base += ch.points.length;
        var id = s.file + '|' + ch.name;
        var tier = tierOf(read, ch.points.length);
        var dates = load('badgeDates', {});
        if (tier && !dates[id + '|' + tier]) {
          var pend = load('badgePending', []);
          pend.push({ id: id, tier: tier });
          save('badgePending', pend);
          var d0 = new Date();
          dates[id + '|' + tier] = (d0.getMonth() + 1) + ' 月 ' + d0.getDate() + ' 日';
          save('badgeDates', dates);
        }
        out.push({ id: id, name: names[id] || ch.name, chapterName: ch.name, file: s.file, subjectName: s.name,
          total: ch.points.length, read: read, tier: tier });
      });
    });
    return out;
  }
  function badgeSummary() {
    var list = badgeList();
    var res = { total: list.length, done: 0, bronze: 0, gold: 0, diamond: 0 };
    list.forEach(function (b) {
      if (b.tier === 'diamond') { res.diamond += 1; res.done += 1; }
      else if (b.tier === 'gold') { res.gold += 1; res.done += 1; }
      else if (b.tier === 'bronze') { res.bronze += 1; res.done += 1; }
    });
    return res;
  }

    var list = badgeList();
    var pend = load('badgePending', []);
    if (pend.length && !state.revealDismissed) {

        rt += '<span style="color:#0b0b0e;font-size:24px;font-weight:600">' + tierLabel(p0.tier) + '</span></div>';

    });
    var sum = badgeSummary();

    var html = '<button class="backbtn" data-act="back">‹</button><div class="hdr"><div class="title">我的徽章</div>' +
      '<div class="sub accent">已集 ' + sum.done + '/' + sum.total + ' · 钻 ' + sum.diamond + ' 金 ' + sum.gold + ' 铜 ' + sum.bronze + '</div></div>' +
      '<div class="scroll"><div class="body">';
    order.forEach(function (name) {
      var items = groups[name];
      var got = items.filter(function (b) { return b.tier; }).length;
      html += '<div class="chapter">' + name + ' · ' + got + '/' + items.length + '</div>';
      items.forEach(function (b) {
        html += '<div class="bdg' + tierCls(b.tier) + '" data-act="bopen:' + encodeURIComponent(b.id) + '">' +
          '<b style="color:' + (b.tier ? '#fff' : '#9a9aa4') + '">' + (b.tier ? b.name : '？？？') + '</b>' +
          '<em style="color:' + tierColor(b.tier) + '">' + (b.tier ? tierLabel(b.tier) : b.read + '/' + b.total) + '</em></div>';
      });
    });
    html += '</div></div>';
    return html;
  }

        var sub = '复习 ' + (it.reviewCount || 0) + ' 次 · 错过 ' + (it.wrongCount || 0) + ' 次';
        if (isMastered(it)) sub = '已记牢 · ' + sub;
        html += '<div class="wb' + (isMastered(it) ? ' ok' : '') + '" data-act="wrm:' + encodeURIComponent(it.key) + '">' +
          '<b>' + it.ask + ' → ' + it.answer + '</b><em>' + sub + '</em></div>';
      });
    });
    html += '</div></div>';
    return html;
  }

  // ---------- 渲染 ----------
  function render() {
    var html = '';
    if (state.view === 'home') html = homeView();
    else if (state.view === 'list') html = listView();
    else if (state.view === 'reader') html = readerView();
    else if (state.view === 'history') html = historyView();
    else if (state.view === 'settings') html = settingsView();
    else if (state.view === 'quiz') html = quizView();
    else if (state.view === 'wrongbook') html = wrongbookView();
    else if (state.view === 'badges') html = badgesView();
    else if (state.view === 'badge') html = badgeDetailView();

    view.innerHTML = html;

    // 亮度：非系统级，用内容透明度模拟（和手表端兜底方案一致）
    var op = 0.4 + 0.6 * (brightness() / 255);
    view.style.opacity = op.toFixed(2);

    bind();
  }

  function bind() {
    view.querySelectorAll('[data-act]').forEach(function (el) {
      el.addEventListener('click', function () {
        handle(el.getAttribute('data-act'));
      });
    });

    view.querySelectorAll('[data-slider]').forEach(function (input) {
      input.addEventListener('input', function () {
        var key = input.getAttribute('data-slider');
        var value = Number(input.value);
        if (key === 'level') save('level', value);
        if (key === 'bright') save('bright', value);
        render();
      });
    });

    var sc = view.querySelector('#scroll');
    if (sc) sc.scrollTop = 0;
  }

  function handle(action) {
    if (action.indexOf('subject:') === 0) {
      state.file = action.slice(8);
      state.chapter = -1;
      state.view = 'list';
      render();
      return;
    }
    if (action.indexOf('cat:') === 0) {
      state.chapter = Number(action.slice(4));
      render();
      return;
    }
    if (action.indexOf('open:') === 0) {
      openPoint(action.slice(5));
      return;
    }
    if (action === 'continue') { openPoint(lastId()); return; }
    if (action === 'flip') {
      if (!state.cardFlip && !isChecked()) {
        checkIn();
        state.justChecked = true;
        render();
        return;
      }
      state.justChecked = false;
      state.cardFlip = !state.cardFlip;
      if (state.cardFlip) {
        var s = streakState();
        if (s.pending) { s.pending = 0; save('streak', s); }
      }
      render();
      return;
    }
    if (action === 'badges') { state.revealDismissed = false; state.view = 'badges'; render(); return; }
    if (action === 'btake') { var pend2 = load('badgePending', []); pend2.shift(); save('badgePending', pend2); state.revealDismissed = false; state.view = 'badges'; render(); return; }
    if (action.indexOf('bopen:') === 0) { state.badgeId = decodeURIComponent(action.slice(6)); state.view = 'badge'; render(); return; }
    if (action === 'quiz') { state.quiz = { mode: 'scope', count: 10 }; state.view = 'quiz'; render(); return; }
    if (action === 'wrongbook') { state.view = 'wrongbook'; render(); return; }
    if (action === 'qcount') {
      var counts = [10, 20, 0];
      var i = counts.indexOf(state.quiz.count);
      state.quiz.count = counts[(i + 1) % counts.length];
      render();
      return;
    }
    if (action === 'qwrong') {
      var items = wrongToReview();
      if (!items.length) return;
      startQuiz(items.map(function (it) {
        return {
          key: it.key, pointId: it.pointId, subjectId: it.subjectId, subjectName: it.subjectName,
          chapterName: it.chapterName, ask: it.ask, answer: it.answer, fromWrong: true
        };
      }));
      return;
    }
    if (action === 'qall') { startQuiz(shuffle(poolOfAll())); return; }
    if (action.indexOf('qsubject:') === 0) { startQuiz(shuffle(poolOfFile(action.slice(9)))); return; }
    if (action === 'qshow') { state.quiz.show = true; render(); return; }
    if (action === 'qright') { judgeQuiz(true); return; }
    if (action === 'qwrongans') { judgeQuiz(false); return; }
    if (action === 'qagain') { state.quiz = { mode: 'scope', count: state.quiz ? state.quiz.count : 10 }; render(); return; }
    if (action === 'qhome') { state.view = 'home'; state.quiz = null; render(); return; }
    if (action.indexOf('wrm:') === 0) {
      wrongRemove(decodeURIComponent(action.slice(4)));
      render();
      return;
    }
    if (action === 'history') { state.view = 'history'; render(); return; }
    if (action === 'settings') { state.view = 'settings'; render(); return; }
    if (action === 'trans') { save('trans', !showTrans()); render(); return; }
    if (action === 'color') { save('color', !showColor()); render(); return; }
    if (action === 'next' || action === 'prev') {
      var found = findPoint(state.pointId);
      if (!found) return;
      var target = found.index + (action === 'next' ? 1 : -1);
      var list = flat(found.file);
      if (target < 0 || target >= list.length) return;
      openPoint(pointIdOf(found.file, target));
      return;
    }
    if (action === 'back') {
      if (state.view === 'list' && state.chapter >= 0) {
        state.chapter = -1;
        render();
        return;
      }
      state.view = state.file ? 'list' : 'home';
      render();
    }
  }

  function startQuiz(questions) {
    var count = state.quiz ? state.quiz.count : 10;
    var picked = count > 0 ? questions.slice(0, count) : questions;
    if (!picked.length) return;
    state.quiz = { mode: 'ask', count: count, questions: picked, index: 0, show: false, right: 0, wrong: 0 };
    render();
  }

  function judgeQuiz(correct) {
    var q = state.quiz;
    var cur = q.questions[q.index];
    if (correct) {
      q.right += 1;
      if (cur.fromWrong) wrongReview(cur.key, true);
    } else {
      q.wrong += 1;
      if (cur.fromWrong) wrongReview(cur.key, false);
      else wrongAdd(cur);
    }
    q.index += 1;
    if (q.index >= q.questions.length) {
      q.mode = 'done';
    } else {
      q.show = false;
    }
    render();
  }

  function openPoint(id) {
    var found = findPoint(id);
    if (!found) return;

    touchToday();
    save('last', id);

    var readMap = readIds();
    readMap[id] = true;
    save('read', readMap);

    var list = history().filter(function (item) { return item.id !== id; });
    list.unshift({ id: id, title: found.entry.point.t, chapter: found.entry.chapter });
    save('history', list.slice(0, 20));

    state.pointId = id;
    state.view = 'reader';
    render();
  }

  // 点击空白处（标题区域）返回上一层
  document.getElementById('watch').addEventListener('click', function (event) {
    if (event.target.closest('[data-act]')) return;
    if (event.target.closest('[data-slider]')) return;
    if (event.target.classList.contains('track')) return;
    if (event.target.closest('.hdr') && state.view !== 'home') {
      handle('back');
    }
  });

  // 键盘：↑↓ 滚动，←→ 上下一条
  document.addEventListener('keydown', function (event) {
    if (state.view !== 'reader') return;
    if (event.key === 'ArrowRight') handle('next');
    if (event.key === 'ArrowLeft') handle('prev');
  });

  // 支持用 hash 直接打开某页（方便作品集里做深链，也方便调试）
  // #list=subjects/chinese-j1.json
  // #reader=subjects/chinese-j1.json:3
  // #settings
  function applyHash() {
    var hash = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (!hash) return;
    var parts = hash.split('=');
    var kind = parts[0];
    var arg = parts[1] || '';
    if (kind === 'list' && arg) {
      // 支持 #list=<file> 与 #list=<file>:<分类序号>
      var seg = arg.split(':');
      if (D.data[seg[0]]) {
        state.file = seg[0];
        state.chapter = seg.length > 1 ? Number(seg[1]) : -1;
        state.view = 'list';
      }
    } else if (kind === 'reader' && arg) {
      var seg = arg.split(':');
      if (D.data[seg[0]]) {
        state.file = seg[0];
        state.view = 'reader';
        state.pointId = pointIdOf(seg[0], Number(seg[1]) || 0);
      }
    } else if (kind === 'quiz') {
      state.quiz = { mode: 'scope', count: 10 };
      state.view = 'quiz';
    } else if (kind === 'quizask') {
      // 深链直接开一局（方便试玩/截图）
      state.quiz = { mode: 'scope', count: 10 };
      state.view = 'quiz';
      startQuiz(shuffle(poolOfAll()));
    } else if (kind === 'wrongbook') {
      state.view = 'wrongbook';
    } else if (kind === 'badges') {
      state.view = 'badges';
    } else if (kind === 'badge') {
      state.badgeId = decodeURIComponent(arg);
      state.view = 'badge';
    } else if (kind === 'seedbadges') {
      // 预览用：给几个分类造点进度，方便看青铜/黄金/钻石三档
      var rm = {};
      var s0 = subject('subjects/chinese-j1.json');
      s0.chapters[0].points.forEach(function (p, i) { rm[pointIdOf('subjects/chinese-j1.json', i)] = true; });
      var m0 = subject('subjects/math-j1.json');
      for (var i2 = 0; i2 < 7; i2 += 1) rm[pointIdOf('subjects/math-j1.json', i2)] = true;
      var ph0 = subject('subjects/physics-j1.json');
      for (var i3 = 0; i3 < 4; i3 += 1) rm[pointIdOf('subjects/physics-j1.json', i3)] = true;
      save('read', rm);
      state.view = 'badges';
    } else if (kind === 'cardback') {
      state.cardFlip = true;
    } else if (kind === 'demo') {
      // 调试/截图用：#demo=7:4 → 连续 7 天、今天已读 4 条
      var seg2 = arg.split(':');
      var days = Number(seg2[0]) || 0;
      var todayCount2 = Number(seg2[1]) || 0;
      save('streak', { streak: days, lastDate: dk(), todayDate: dk(), todayCount: todayCount2, milestones: [], pending: 0 });
    } else if (kind === 'history') {
      state.view = 'history';
    } else if (kind === 'settings') {
      state.view = 'settings';
    }
  }

  applyHash();
  render();
})();
</script>

</html>
