<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网址导航 - 白鲨工具站</title>
  <meta name="description" content="白鲨工具站网址导航：精选搜索、学习、开发、设计、办公、购物、资讯、AI 等优质网站，分类整理，一键直达。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦈</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="page">
    <h1 style="font-size:24px;font-weight:650;letter-spacing:-0.02em;margin-bottom:6px">网址导航</h1>
    <p style="color:var(--text-2);font-size:14px;margin-bottom:26px">精选优质网站 + 实时热搜，分类整理，点击直达</p>

    <div class="panel" style="margin-bottom:26px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        <span style="font-size:15px;font-weight:600;letter-spacing:-0.01em">实时热搜</span>
        <div class="cat-tabs" id="hot-tabs" style="margin-bottom:0;flex:1"></div>
        <button class="btn ghost small" id="hot-refresh">刷新</button>
      </div>
      <div id="hot-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:4px 24px">
        <div style="color:var(--text-2);padding:10px">正在加载热搜…</div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:26px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <span style="font-size:17px;font-weight:700">🌟 每日推荐</span>
        <span style="font-size:12.5px;color:var(--text-2)">每天换一批，帮你发现好网站</span>
      </div>
      <div class="nav-grid" id="daily-picks"></div>
    </div>

    <div id="nav-groups"></div>
  </main>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/site.js"></script>
  <script>
    (function () {
      // ---------- 每日推荐（按星期轮换） ----------
      var DAILY = [
        [
          { name: 'DeepSeek', url: 'https://chat.deepseek.com', desc: '免费 AI 助手，试试让它写文案', icon: '🐋' },
          { name: '菜鸟教程', url: 'https://www.runoob.com', desc: '想学编程？从入门教程开始', icon: '🐦' },
          { name: 'JSON 在线', url: 'https://www.json.cn', desc: 'JSON 格式化、转义、对比', icon: '🧾' },
          { name: 'ProcessOn', url: 'https://www.processon.com', desc: '免费在线思维导图', icon: '🗺️' },
        ],
        [
          { name: 'B站', url: 'https://www.bilibili.com', desc: '教程视频宝库', icon: '📺' },
          { name: 'iconfont', url: 'https://www.iconfont.cn', desc: '免费图标库，设计必备', icon: '🔣' },
          { name: '什么值得买', url: 'https://www.smzdm.com', desc: '买东西前先看看历史低价', icon: '💡' },
          { name: '腾讯文档', url: 'https://docs.qq.com', desc: '在线协作，手机电脑同步', icon: '📄' },
        ],
        [
          { name: 'Kimi', url: 'https://kimi.moonshot.cn', desc: '长文本 AI，一次读一本书', icon: '🌙' },
          { name: 'Can I Use', url: 'https://caniuse.com', desc: '查浏览器兼容性', icon: '🌐' },
          { name: '花瓣网', url: 'https://huaban.com', desc: '找设计灵感', icon: '🌸' },
          { name: '慢慢买', url: 'https://www.manmanbuy.com', desc: '商品历史价格查询', icon: '📉' },
        ],
        [
          { name: '豆包', url: 'https://www.doubao.com', desc: '字节 AI 助手，日常问答快', icon: '🫘' },
          { name: 'MDN Web Docs', url: 'https://developer.mozilla.org/zh-CN/', desc: 'Web 开发权威文档', icon: '📖' },
          { name: '稿定设计', url: 'https://www.gaoding.com', desc: '不会设计也能做图', icon: '🖼️' },
          { name: 'IT之家', url: 'https://www.ithome.com', desc: '数码科技资讯', icon: '📱' },
        ],
        [
          { name: '通义千问', url: 'https://tongyi.aliyun.com', desc: '阿里 AI，办公场景好用', icon: '☁️' },
          { name: 'GitHub', url: 'https://github.com', desc: '程序员的世界，开源宝库', icon: '🐙' },
          { name: '幕布', url: 'https://mubu.com', desc: '大纲笔记，理清思路', icon: '🧠' },
          { name: '36氪', url: 'https://36kr.com', desc: '科技创投新闻', icon: '🚀' },
        ],
        [
          { name: '文心一言', url: 'https://yiyan.baidu.com', desc: '百度 AI 助手', icon: '🗣️' },
          { name: '知乎', url: 'https://www.zhihu.com', desc: '高质量问答社区', icon: '💬' },
          { name: '中国大学MOOC', url: 'https://www.icourse163.org', desc: '名校课程免费学', icon: '🎓' },
          { name: '少数派', url: 'https://sspai.com', desc: '数字生活效率指南', icon: '🍎' },
        ],
        [
          { name: '即梦', url: 'https://jimeng.jianying.com', desc: 'AI 画图，中文友好', icon: '🎨' },
          { name: '语雀', url: 'https://www.yuque.com', desc: '知识库笔记', icon: '📓' },
          { name: '知乎热榜', url: 'https://www.zhihu.com/hot', desc: '今天大家在聊什么', icon: '🔥' },
          { name: '微博热搜', url: 'https://s.weibo.com/top/summary', desc: '实时热点话题', icon: '📰' },
        ],
      ];
      var dayIdx = new Date().getDay(); // 0-6
      var picks = DAILY[dayIdx];
      var today = new Date();
      document.getElementById('daily-picks').innerHTML = picks.map(function (p) {
        return '<a class="nav-card" href="' + p.url + '" target="_blank" rel="noopener">' +
          '<span class="nv-icon">' + p.icon + '</span>' +
          '<span><span class="nv-name">' + p.name + '</span>' +
          '<span class="nv-desc">' + p.desc + '</span></span>' +
          '<span class="nv-ext">今日</span></a>';
      }).join('');

      // ---------- 实时热搜 ----------
      var hotData = null;
      var hotSource = null;

      function renderHot() {
        if (!hotData || !hotData.sources.length) {
          document.getElementById('hot-list').innerHTML = '<div style="color:var(--text-2);padding:10px">热搜暂不可用，请稍后刷新</div>';
          return;
        }
        var tabs = document.getElementById('hot-tabs');
        var first = hotData.sources.find(function (s) { return s.items.length; }) || hotData.sources[0];
        if (!hotSource) hotSource = first.id;
        if (!hotData.sources.some(function (s) { return s.id === hotSource && s.items.length; })) hotSource = first.id;

        tabs.innerHTML = hotData.sources.map(function (s) {
          return '<button class="cat-tab' + (s.id === hotSource ? ' active' : '') + '" data-id="' + s.id + '">' + s.icon + ' ' + s.name + (s.error ? ' ⚠️' : '') + '</button>';
        }).join('');
        tabs.querySelectorAll('.cat-tab').forEach(function (btn) {
          btn.addEventListener('click', function () {
            hotSource = btn.dataset.id;
            renderHot();
          });
        });

        var src = hotData.sources.find(function (s) { return s.id === hotSource; });
        if (!src || !src.items.length) {
          document.getElementById('hot-list').innerHTML = '<div style="color:var(--text-2);padding:10px">该源暂不可用：' + (src ? src.error || '未知原因' : '') + '</div>';
          return;
        }
        document.getElementById('hot-list').innerHTML = src.items.map(function (it) {
          var badge = it.rank <= 3 ? '<span style="color:#ef4444;font-weight:800">' + it.rank + '</span>' : '<span style="color:var(--text-2)">' + it.rank + '</span>';
          return '<a href="' + (it.url || 'javascript:void(0)') + '"' + (it.url ? ' target="_blank" rel="noopener"' : '') + ' style="display:flex;align-items:center;gap:10px;padding:8px 6px;text-decoration:none;color:var(--text);border-bottom:1px dashed var(--border);font-size:14px">' +
            '<span style="width:22px;text-align:center">' + badge + '</span>' +
            '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + it.word + '</span>' +
            (it.heat ? '<span style="font-size:12px;color:var(--text-2);flex-shrink:0">' + it.heat + '</span>' : '') +
            '</a>';
        }).join('');
      }

      function loadHot() {
        var list = document.getElementById('hot-list');
        list.innerHTML = '<div style="color:var(--text-2);padding:10px">正在加载热搜…</div>';
        fetch('api/hot-search')
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (!res.ok) throw new Error(res.error || '加载失败');
            hotData = res.data;
            renderHot();
          })
          .catch(function (e) {
            list.innerHTML = '<div style="color:#ef4444;padding:10px">热搜加载失败：' + e.message + '</div>';
          });
      }

      document.getElementById('hot-refresh').addEventListener('click', function () {
        hotSource = null;
        loadHot();
        BS.toast('正在刷新…');
      });
      loadHot();

      // ---------- 网址导航 ----------
      BS_UI.fetchJSON('assets/data/sites.json').then(function (sites) {
        sites.forEach(function (g) {
          g.sites.forEach(function (s) {
            window.BS_DATA.sites.push({ name: s.name, desc: s.desc, url: s.url, icon: s.icon, cat: g.cat });
          });
        });
        BS_UI.renderNav(document.getElementById('nav-groups'), sites);
      });
    })();
  </script>
</body>
</html>
