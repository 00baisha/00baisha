<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片加水印 - 白鲨工具站</title>
  <meta name="description" content="在线图片加水印工具：文字水印，可调位置、大小、透明度、旋转，一键下载。图片本地处理，不上传。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦈</text></svg>">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="tool-main">
    <div class="tool-breadcrumb"></div>
    <div class="tool-head">
      <h1>💧 图片加水印</h1>
      <p class="tool-desc">给图片加文字水印，保护你的作品版权。图片在本地处理，不会上传。</p>
    </div>

    <div class="panel">
      <div class="file-drop" id="drop">
        <div class="fd-icon">🖼️</div>
        <div class="fd-hint">点击选择图片，或直接拖进来</div>
        <input type="file" id="file" accept="image/*">
      </div>
      <div class="form-grid" style="margin-top:16px">
        <div>
          <label class="panel-label">水印文字</label>
          <input type="text" id="wm-text" value="© 白鲨工具站" style="width:100%">
        </div>
        <div>
          <label class="panel-label">位置</label>
          <select id="wm-pos" style="width:100%">
            <option value="tl">左上</option>
            <option value="tr">右上</option>
            <option value="bl">左下</option>
            <option value="br" selected>右下</option>
            <option value="center">居中</option>
            <option value="tile">平铺全图</option>
          </select>
        </div>
        <div>
          <label class="panel-label">字号：<span id="size-val">36</span></label>
          <input type="range" id="wm-size" min="12" max="120" value="36" style="width:100%">
        </div>
        <div>
          <label class="panel-label">透明度：<span id="opacity-val">60%</span></label>
          <input type="range" id="wm-opacity" min="5" max="100" value="60" style="width:100%">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" id="btn-download" disabled>⬇️ 下载加水印的图片</button>
        <button class="btn ghost" id="btn-reset">🔄 重新选择</button>
      </div>
      <div class="result-line" id="status"></div>
    </div>

    <div class="panel" id="preview-panel" style="display:none">
      <label class="panel-label">预览</label>
      <img class="preview-img" id="preview" alt="加水印预览">
    </div>
  </main>

  <script src="../assets/js/common.js"></script>
  <script>
    BS.injectBreadcrumb('图片加水印');

    var drop = document.getElementById('drop');
    var fileInput = document.getElementById('file');
    var wmText = document.getElementById('wm-text');
    var wmPos = document.getElementById('wm-pos');
    var wmSize = document.getElementById('wm-size');
    var wmOpacity = document.getElementById('wm-opacity');
    var sizeVal = document.getElementById('size-val');
    var opacityVal = document.getElementById('opacity-val');
    var downloadBtn = document.getElementById('btn-download');
    var previewPanel = document.getElementById('preview-panel');
    var preview = document.getElementById('preview');
    var status = document.getElementById('status');

    var current = null; // { img, name }

    function applyWatermark() {
      if (!current) return;
      var img = current.img;
      var canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);

      var text = wmText.value.trim() || '水印';
      var fontSize = parseInt(wmSize.value, 10);
      var alpha = parseInt(wmOpacity.value, 10) / 100;
      ctx.font = 'bold ' + fontSize + 'px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
      ctx.textBaseline = 'middle';
      var tw = ctx.measureText(text).width;

      var pos = wmPos.value;
      var margin = fontSize * 0.6;
      if (pos === 'tile') {
        var stepX = tw + fontSize * 2;
        var stepY = fontSize * 3;
        ctx.rotate(-Math.PI / 6);
        for (var y = -img.height; y < img.height * 2; y += stepY) {
          for (var x = -img.width; x < img.width * 2; x += stepX) {
            ctx.fillText(text, x, y);
          }
        }
      } else {
        var x, y;
        if (pos === 'tl') { x = margin; y = margin; }
        else if (pos === 'tr') { x = img.width - tw - margin; y = margin; }
        else if (pos === 'bl') { x = margin; y = img.height - margin; }
        else if (pos === 'br') { x = img.width - tw - margin; y = img.height - margin; }
        else { x = (img.width - tw) / 2; y = img.height / 2; }
        // 加阴影提高可读性
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = fontSize * 0.2;
        ctx.fillText(text, x, y);
      }

      current.dataUrl = canvas.toDataURL('image/png');
      preview.src = current.dataUrl;
      previewPanel.style.display = 'block';
      downloadBtn.disabled = false;
    }

    function loadFile(file) {
      if (!file || !file.type.startsWith('image/')) { BS.toast('请选择图片文件'); return; }
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          current = { img: img, name: file.name };
          applyWatermark();
          status.textContent = '✅ 已加载：' + file.name + '（' + img.width + '×' + img.height + '）';
          status.style.color = '#16a34a';
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    drop.addEventListener('click', function () { fileInput.click(); });
    drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('drag'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('drag'); });
    drop.addEventListener('drop', function (e) {
      e.preventDefault(); drop.classList.remove('drag');
      if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', function () { if (fileInput.files.length) loadFile(fileInput.files[0]); });
    wmText.addEventListener('input', applyWatermark);
    wmPos.addEventListener('change', applyWatermark);
    wmSize.addEventListener('input', function () { sizeVal.textContent = wmSize.value; applyWatermark(); });
    wmOpacity.addEventListener('input', function () { opacityVal.textContent = wmOpacity.value + '%'; applyWatermark(); });
    downloadBtn.addEventListener('click', function () {
      if (!current) return;
      var a = document.createElement('a');
      a.href = current.dataUrl;
      a.download = current.name.replace(/\.[^.]+$/, '') + '-watermark.png';
      a.click();
      BS.toast('开始下载 ⬇️');
    });
    document.getElementById('btn-reset').addEventListener('click', function () {
      current = null; previewPanel.style.display = 'none'; downloadBtn.disabled = true;
      status.textContent = ''; fileInput.value = '';
    });
  </script>
</body>
</html>
