<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown 预览 - 白鲨工具站</title>
  <meta name="description" content="在线 Markdown 编辑器：左侧写右侧实时预览，支持标题、加粗、列表、代码块、链接等。数据本地处理，不上传。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦈</text></svg>">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .md-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 700px) { .md-wrap { grid-template-columns: 1fr; } }
    .md-editor { width: 100%; min-height: 420px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-family: "SF Mono", Consolas, "Courier New", monospace; font-size: 13.5px; line-height: 1.7; resize: vertical; outline: none; }
    .md-editor:focus { border-color: var(--primary); }
    .md-preview { min-height: 420px; padding: 14px 18px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-soft); overflow-wrap: break-word; }
    .md-preview h1, .md-preview h2, .md-preview h3 { margin: 0.8em 0 0.4em; line-height: 1.3; }
    .md-preview h1 { font-size: 1.6em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
    .md-preview h2 { font-size: 1.35em; }
    .md-preview p { margin: 0.5em 0; }
    .md-preview ul, .md-preview ol { padding-left: 1.6em; margin: 0.5em 0; }
    .md-preview code { background: var(--bg-soft-2); padding: 0.15em 0.4em; border-radius: 4px; font-size: 0.9em; }
    .md-preview pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; }
    .md-preview pre code { background: none; padding: 0; }
    .md-preview blockquote { border-left: 3px solid var(--primary); margin: 0.5em 0; padding: 0.1em 1em; color: var(--text-2); }
    .md-preview table { border-collapse: collapse; margin: 0.8em 0; }
    .md-preview th, .md-preview td { border: 1px solid var(--border); padding: 6px 12px; }
    .md-preview a { color: var(--primary); }
    .md-preview img { max-width: 100%; }
  </style>
</head>
<body>
  <main class="tool-main" style="max-width:1000px">
    <div class="tool-breadcrumb"></div>
    <div class="tool-head">
      <h1>📝 Markdown 预览</h1>
      <p class="tool-desc">左边写 Markdown，右边实时预览。写文章、写 README 都能用，内容只在本地。</p>
    </div>

    <div class="panel">
      <div class="md-wrap">
        <div>
          <label class="panel-label">Markdown 源码</label>
          <textarea id="md-input" class="md-editor" spellcheck="false"># 欢迎使用 Markdown

**Markdown** 是一种轻量级标记语言，写起来就像聊天。

## 常用语法

- **加粗**、*斜体*、`行内代码`
- [链接](https://example.com)

> 引用一段话：保持简单，保持干净。

\`\`\`js
// 代码块
console.log("你好，白鲨工具站！");
\`\`\`

## 表格

| 工具 | 用途 |
|------|------|
| JSON 格式化 | 调试数据 |
| 图片压缩 | 减小体积 |

---

试试修改左边，右边会实时更新 ✨</textarea>
        </div>
        <div>
          <label class="panel-label">实时预览</label>
          <div class="md-preview" id="md-preview"></div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn ghost" id="btn-copy-md">📋 复制 Markdown</button>
        <button class="btn ghost" id="btn-copy-html">📋 复制 HTML</button>
      </div>
    </div>
  </main>

  <script src="../assets/js/common.js"></script>
  <script src="../assets/vendor/marked.min.js"></script>
  <script>
    BS.injectBreadcrumb('Markdown 预览');

    var inputEl = document.getElementById('md-input');
    var previewEl = document.getElementById('md-preview');

    function render() {
      previewEl.innerHTML = marked.parse(inputEl.value);
    }

    inputEl.addEventListener('input', render);
    render();

    document.getElementById('btn-copy-md').addEventListener('click', function () {
      navigator.clipboard.writeText(inputEl.value).then(function () { BS.toast('Markdown 已复制 📋'); });
    });
    document.getElementById('btn-copy-html').addEventListener('click', function () {
      navigator.clipboard.writeText(previewEl.innerHTML).then(function () { BS.toast('HTML 已复制 📋'); });
    });
  </script>
</body>
</html>
