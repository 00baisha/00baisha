<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>九宫格切图 - 白鲨工具站</title>
  <meta name="description" content="在线九宫格切图工具：图片一键切成 3×3 九宫格，发朋友圈、小红书必备。图片本地处理，不上传。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦈</text></svg>">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="tool-main">
    <div class="tool-breadcrumb"></div>
    <div class="tool-head">
      <h1>🔲 九宫格切图</h1>
      <p class="tool-desc">把一张图切成 3×3 九宫格，发朋友圈九宫格、小红书拼图必备。图片本地处理，不会上传。</p>
    </div>

    <div class="panel">
      <div class="file-drop" id="drop">
        <div class="fd-icon">🖼️</div>
        <div class="fd-hint">点击选择图片，或直接拖进来</div>
        <input type="file" id="file" accept="image/*">
      </div>
      <div class="result-line" id="status"></div>
    </div>

    <div class="panel" id="result" style="display:none">
      <label class="panel-label">切图预览（点击任意一块下载）</label>
      <div id="grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:420px;margin:0 auto"></div>
      <div class="btn-row" style="justify-content:center">
        <button class="btn" id="btn-all">⬇️ 依次下载全部 9 张</button>
        <button class="btn ghost" id="btn-reset">🔄 重新选择</button>
      </div>
      <div class="result-line" style="text-align:center">💡 小技巧：按顺序保存后，在朋友圈按顺序发 9 张，就是一张大图</div>
    </div>
  </main>

  <script src="../assets/js/common.js"></script>
  <script>
    BS.injectBreadcrumb('九宫格切图');

    var drop = document.getElementById('drop');
    var fileInput = document.getElementById('file');
    var statusEl = document.getElementById('status');
    var resultPanel = document.getElementById('result');
    var gridEl = document.getElementById('grid');

    var pieces = []; // [{dataUrl, name}]

    function sliceImage(img, name) {
      pieces = [];
      var pw = Math.floor(img.width / 3);
      var ph = Math.floor(img.height / 3);
      if (pw < 10 || ph < 10) {
        statusEl.textContent = '❌ 图片太小，切出来会看不清（建议至少 300px）';
        statusEl.style.color = '#ef4444';
        return;
      }
      for (var r = 0; r < 3; r++) {
        for (var c = 0; c < 3; c++) {
          var canvas = document.createElement('canvas');
          canvas.width = pw;
          canvas.height = ph;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, c * pw, r * ph, pw, ph, 0, 0, pw, ph);
          var base = name.replace(/\.[^.]+$/, '');
          pieces.push({ dataUrl: canvas.toDataURL('image/jpeg', 0.92), name: base + '-' + (r * 3 + c + 1) + '.jpg' });
        }
      }
      renderGrid();
      resultPanel.style.display = 'block';
      statusEl.textContent = '✅ 已切成 9 块（每块 ' + pw + '×' + ph + 'px）';
      statusEl.style.color = '#16a34a';
    }

    function renderGrid() {
      gridEl.innerHTML = pieces.map(function (p, i) {
        return '<img src="' + p.dataUrl + '" data-i="' + i + '" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--border)" alt="第' + (i + 1) + '块">';
      }).join('');
      gridEl.querySelectorAll('img').forEach(function (img) {
        img.addEventListener('click', function () { downloadPiece(+img.dataset.i); });
      });
    }

    function downloadPiece(i) {
      var a = document.createElement('a');
      a.href = pieces[i].dataUrl;
      a.download = pieces[i].name;
      a.click();
      BS.toast('已下载第 ' + (i + 1) + ' 块 ⬇️');
    }

    document.getElementById('btn-all').addEventListener('click', function () {
      var i = 0;
      function next() {
        if (i >= pieces.length) { BS.toast('全部 9 张已开始下载 ⬇️'); return; }
        var a = document.createElement('a');
        a.href = pieces[i].dataUrl;
        a.download = pieces[i].name;
        a.click();
        i++;
        setTimeout(next, 400);
      }
      next();
    });

    function loadFile(file) {
      if (!file || !file.type.startsWith('image/')) { BS.toast('请选择图片文件'); return; }
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () { sliceImage(img, file.name); };
        img.onerror = function () { statusEl.textContent = '❌ 图片加载失败'; statusEl.style.color = '#ef4444'; };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    drop.addEventListener('click', function () { fileInput.click(); });
    drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('drag'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('drag'); });
    drop.addEventListener('drop', function (e) {
      e.preventDefault(); drop.classList.remove('drag');
      if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', function () { if (fileInput.files.length) loadFile(fileInput.files[0]); });
    document.getElementById('btn-reset').addEventListener('click', function () {
      pieces = []; resultPanel.style.display = 'none'; statusEl.textContent = ''; fileInput.value = '';
    });
  </script>
</body>
</html>
